              Golden Flying Limited

            <p className="mt-6 text-base md:text-lg text-gray-200 max-w-4xl leading-relaxed">
              Golden Flying Limited is a company dedicated to global trade services, with deep expertise in two core areas: e-commerce and international cargo trading. Leveraging efficient global supply chain resources and digital operations capabilities, we build a commercial bridge that connects businesses worldwide, enabling efficient product circulation and creating mutually beneficial outcomes.
            </p>
          </div>
        </section>

        <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-20">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 items-stretch">
            <div className="relative min-h-[360px] group overflow-hidden border border-gray-200">
              <img
                src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=80"
                alt="Global logistics"
                className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-zinc-950/90 via-zinc-950/35 to-transparent"></div>
              <div className="absolute bottom-0 left-0 p-6">
                <p className="text-xs uppercase tracking-[0.2em] text-gray-300 mb-2">Global Supply Chain</p>
                <h3 className="text-white text-2xl font-bold">Efficiently Connecting Global Supply and Demand</h3>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div className="border border-gray-200 bg-gray-50 p-6 hover:shadow-xl transition-shadow">
                <Globe className="h-7 w-7 text-zinc-900" />
                <h4 className="mt-4 text-zinc-900 font-bold uppercase tracking-wide text-sm">E-Commerce</h4>
                <p className="mt-2 text-sm text-gray-500 leading-relaxed">
                  Our digital operating system integrates product selection, marketing, fulfillment, and service to improve cross-border transaction efficiency.
                </p>
              </div>
              <div className="border border-gray-200 bg-gray-50 p-6 hover:shadow-xl transition-shadow">
                <Truck className="h-7 w-7 text-zinc-900" />
                <h4 className="mt-4 text-zinc-900 font-bold uppercase tracking-wide text-sm">International Cargo Trading</h4>
                <p className="mt-2 text-sm text-gray-500 leading-relaxed">
                  Backed by stable international logistics and sourcing networks, we enable efficient global circulation across multiple product categories.
                </p>
              </div>
              <div className="border border-gray-200 bg-gray-50 p-6 hover:shadow-xl transition-shadow sm:col-span-2">
                <h4 className="text-zinc-900 font-bold uppercase tracking-wide text-sm">Our Value Proposition</h4>
                <p className="mt-2 text-sm text-gray-500 leading-relaxed">
                  Through professional, transparent, and highly responsive trade services, we help partners reduce costs, improve efficiency, and expand market reach in global competition.
                </p>
              </div>
            </div>
          </div>

          <div className="mt-12 border border-gray-200 bg-white p-7 md:p-10">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
              <div>
                <h3 className="text-2xl font-extrabold text-zinc-900 uppercase tracking-wide">Build Global Business Together</h3>
                <p className="mt-2 text-gray-500 text-sm md:text-base">
                  From supply chain coordination to cross-border fulfillment, we continuously build faster, more reliable, and growth-oriented trade pathways for our clients.
                </p>
              </div>
              <button
                onClick={onNavigateHome}
                className="h-11 px-7 bg-zinc-900 text-white text-sm font-bold uppercase tracking-wider hover:bg-zinc-800 transition-colors"
              >
                Explore Collection
              </button>
            </div>
          </div>
        </section>
      </div>
    );

    const ProductDetailView = ({ product, onBack, onInquire }) => {
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, [product]);

      if (!product) return null;

      return (
        <div className="bg-white min-h-screen pb-20">
          <div className="border-b border-gray-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
              <button
                onClick={onBack}
                className="flex items-center text-gray-400 hover:text-zinc-900 transition-colors text-xs font-bold uppercase tracking-wider"
              >
                <ArrowLeft className="h-4 w-4 mr-2" /> Back to Collection
              </button>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div className="flex flex-col lg:flex-row gap-12">
              <div className="w-full lg:w-1/2 bg-gray-50 relative aspect-square lg:aspect-auto lg:min-h-[700px]">
                <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
              </div>

              <div className="w-full lg:w-1/2 flex flex-col py-4">
                <span className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-200 inline-block pb-1 w-max">
                  {product.category}
                </span>
                <h1 className="text-3xl lg:text-4xl font-extrabold text-zinc-900 mb-4 leading-tight">
                  {product.name}
                </h1>

                <div className="flex items-center mb-6">
                  <div className="flex items-center text-zinc-900">
                    <Star className="h-4 w-4 fill-current" />
                    <Star className="h-4 w-4 fill-current" />
                    <Star className="h-4 w-4 fill-current" />
                    <Star className="h-4 w-4 fill-current" />
                    <Star className="h-4 w-4 fill-current text-gray-200" />
                  </div>
                  <span className="ml-3 text-sm text-zinc-600 font-medium">{product.rating} Rating</span>
                  <span className="mx-3 text-gray-300">|</span>
                  <span className="text-sm text-gray-400 cursor-pointer hover:text-zinc-900 transition-colors">{product.reviews} Reviews</span>
                </div>

                <div className="text-3xl font-light text-zinc-900 mb-8">
                  ${product.price.toLocaleString("en-US", { minimumFractionDigits: 2 })}
                </div>

                <p className="text-gray-500 text-base mb-10 leading-relaxed font-light">
                  {product.description}
                </p>

                <div className="mb-12">
                  <button
                    onClick={onInquire}
                    className="w-full h-14 bg-zinc-900 hover:bg-zinc-800 text-white font-bold text-sm tracking-widest uppercase flex items-center justify-center transition-all duration-300 shadow-xl"
                  >
                    <MessageCircle className="mr-2 h-5 w-5" /> Request a Quote
                  </button>
                </div>

                <div className="mt-auto border-t border-gray-200 pt-8">
                  <h3 className="text-sm font-bold text-zinc-900 mb-4 uppercase tracking-widest flex items-center">
                    <Info className="h-4 w-4 mr-2 text-gray-400" /> Details & Specifications
                  </h3>
                  <div className="bg-gray-50 p-6 text-sm">
                    <dl className="divide-y divide-gray-200">
                      {product.specs.map((spec, index) => (
                        <div key={index} className="py-3 flex justify-between">
                          <dt className="text-gray-500">{spec.label}</dt>
                          <dd className="text-zinc-900 font-medium text-right">{spec.value}</dd>
                        </div>
                      ))}
                    </dl>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [currentView, setCurrentView] = useState("home");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isConsultationOpen, setIsConsultationOpen] = useState(false);

      const navigateToHome = () => {
        setSelectedProduct(null);
        setCurrentView("home");
      };

      const navigateToProduct = (product) => {
        setSelectedProduct(product);
        setCurrentView("product");
      };

      const navigateToAbout = () => {
        setSelectedProduct(null);
        setCurrentView("about");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div className="min-h-screen flex flex-col font-sans bg-white selection:bg-zinc-900 selection:text-white">
          <Navbar onNavigateHome={navigateToHome} onNavigateAbout={navigateToAbout} />

          <main className="flex-grow">
            {currentView === "home" && <HomeView onProductClick={navigateToProduct} />}

            {currentView === "about" && <AboutView onNavigateHome={navigateToHome} />}

            {currentView === "product" && (
              <ProductDetailView
                product={selectedProduct}
                onBack={navigateToHome}
                onInquire={() => setIsConsultationOpen(true)}
              />
            )}
          </main>

          <Footer />

          <ConsultationWidget isOpen={isConsultationOpen} setIsOpen={setIsConsultationOpen} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
